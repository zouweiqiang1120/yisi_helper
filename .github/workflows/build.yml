name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
    
    - name: Setup Android SDK
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
      continue-on-error: true
    
    - name: Find APK
      run: |
        echo "=== Searching for APK ==="
        find . -name "*.apk" -type f 2>/dev/null
        echo ""
        echo "=== Build directory contents ==="
        ls -la build/ 2>/dev/null || echo "No build directory"
        ls -la build/app/ 2>/dev/null || echo "No app directory"
        ls -la build/app/outputs/ 2>/dev/null || echo "No outputs directory"
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk directory"
        ls -la build/app/outputs/apk/ 2>/dev/null || echo "No apk directory"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yisi-helper-apk
        path: build/**/*.apk
        if-no-files-found: warn
