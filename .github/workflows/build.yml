name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
    
    - name: Debug - Check directory structure
      run: |
        echo "=== Current Directory ==="
        pwd
        echo ""
        echo "=== All Files in Root ==="
        ls -la
        echo ""
        echo "=== Check for nested yisi_helper ==="
        ls -la yisi_helper 2>/dev/null || echo "No yisi_helper subdirectory"
        echo ""
        echo "=== Find pubspec.yaml ==="
        find . -name "pubspec.yaml" -type f 2>/dev/null
    
    - name: Setup Flutter SDK path
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
        cat android/local.properties
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK with error handling
      run: |
        set -e
        flutter build apk --release || {
          echo "=== Build failed, checking for APK anyway ==="
          find . -name "*.apk" -type f 2>/dev/null
          exit 1
        }
    
    - name: Find and upload APK
      run: |
        echo "=== Searching for APK ==="
        APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "Found APK at: $APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/
        else
          echo "APK not found, listing build directory:"
          find build -name "*.apk" 2>/dev/null || echo "No APK files found"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yisi-helper-apk
        path: output/*.apk
        if-no-files-found: warn
