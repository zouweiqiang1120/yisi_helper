name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
    
    - name: Check project structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== Root directory contents ==="
        ls -la
        echo ""
        echo "=== Check for pubspec.yaml ==="
        if [ -f "pubspec.yaml" ]; then
          echo "pubspec.yaml found in root directory"
          cat pubspec.yaml | head -5
        else
          echo "pubspec.yaml NOT found in root directory"
        fi
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Check build output
      run: |
        echo "=== Looking for APK ==="
        find . -name "*.apk" -type f 2>/dev/null
        echo ""
        echo "=== Build directory ==="
        ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "APK directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yisi-helper-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: warn
