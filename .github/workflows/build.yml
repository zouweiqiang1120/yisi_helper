name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
    
    - name: Verify environment
      run: |
        echo "=== Flutter Version ==="
        flutter --version
        echo ""
        echo "=== Project Structure ==="
        pwd
        ls -la
        echo ""
        echo "=== pubspec.yaml ==="
        cat pubspec.yaml
    
    - name: Setup Android SDK
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
        echo "=== local.properties ==="
        cat android/local.properties
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK with detailed logging
      run: |
        flutter build apk --release --verbose 2>&1 | tee build.log
        echo "=== Build completed, checking exit code ==="
        echo "Exit code: ${PIPESTATUS[0]}"
    
    - name: Check build outputs
      run: |
        echo "=== Build Directory Structure ==="
        find build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
        echo ""
        echo "=== All files in build directory ==="
        ls -laR build/ 2>/dev/null | head -100 || echo "Build directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yisi-helper-apk
        path: build/app/outputs/**/*.apk
        if-no-files-found: warn
